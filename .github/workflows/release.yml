name: Acreedom Linux Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acreedom-linux-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MOZBUILD_STATE_PATH: ${{ runner.temp }}/mozbuild
      MOZ_NOSPAM: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install source preparation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-jsonschema python3-venv zip unzip xz-utils bzip2 wget gnupg imagemagick librsvg2-bin autoconf2.13 nasm yasm libgtk-3-dev libdbus-glib-1-dev libxt-dev xvfb
      - name: Prepare verified IceCat source and Acreedom branding
        run: |
          ./makeicecat
          python3 tools/brand-acreedom.py
      - name: Bootstrap compiler toolchain
        working-directory: output
        run: |
          cd icecat-*/
          ./mach --no-interactive bootstrap --application-choice browser
      - name: Compile and package Acreedom
        run: bash tools/build-acreedom.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acreedom-linux-x86_64
          path: output/release/*
          if-no-files-found: error
      - name: Publish compiled release
        run: |
          TAG="acreedom-$(cat output/release/VERSION)-${GITHUB_SHA:0:12}"
          gh release create "$TAG" output/release/* --target "$GITHUB_SHA" --title "Acreedom $(cat output/release/VERSION) Linux x86-64" --notes-file output/release/BUILD.md
